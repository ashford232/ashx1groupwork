services:
  postgres:
    image: postgres:18
    container_name: kolu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: kolu
      POSTGRES_DB: kolu
    ports:
      - "5432:5432"
    volumes:
      - kolu_postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: kolu-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kolu.com
      PGADMIN_DEFAULT_PASSWORD: kolu
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  kolu_postgres_data: